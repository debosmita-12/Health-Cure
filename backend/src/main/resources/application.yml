server:
  port: 8080

spring:
  application:
    name: health-cure-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

jwt:
  secret: ${JWT_SECRET:health-cure-jwt-super-secret-key-for-development-must-be-at-least-256-bits-long-2026}
  expiration-ms: 86400000

logging:
  level:
    root: INFO
    com.healthcure: DEBUG

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:healthcure;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/healthcure}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
